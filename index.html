<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Career Roadmap</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-inner">
                <!--Title Area-->
                <div class="title-block">
                    <h1>Alex's Engineering Roadmap</h1>
                    <p class="tagline">From IT Support to Software Engineering</p>
                </div>

                <div class="header-divider" aria-hidden="true"></div>

                <!--Live Tracker-->
                <div class="fcc-tracker" aria-label="freeCodeCamp progress tracker">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="fcc-status-text" class="fcc-status-text">HTML5 → CSS3</span>
                    <button type="button" id="fcc-sync-btn" class="fcc-icon-btn"
                    title="Sync from freeCodeCamp username or update section" aria-label="Sync or update freeCodeCamp section">
                        ↻
                    </button>
                </div>

                <!--Nav Links-->
                <nav class="nav-pill" aria-label="Primary Navigation">
                    <ul>
                        <li><a href="#roadmap">Roadmap</a></li>
                        <li><a href="#projects">Projects</a></li>
                        <li><a href="#ai-coach">AI Coach</a></li>
                        <li><a href="#journal">Study Log</a></li>
                    </ul>
                </nav>
            </div>
        </header>
    </body>
</html>
